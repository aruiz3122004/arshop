# ═══════════════════════════════════════════════════════════════════════════
# Infraestructura local para la API de ARShop.
#   - Redis   → cola BullMQ (envíos de correo, tareas en background)
#   - API     → Nest con hot-reload montando ./src
# PostgreSQL + Auth los provee Supabase (cloud). Si quieres Postgres local
# para pruebas rápidas sin Supabase, descomenta el servicio `postgres`.
# ═══════════════════════════════════════════════════════════════════════════

services:
  redis:
    image: redis:7-alpine
    container_name: arshop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: arshop-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-4000}:4000"
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.build.json:/app/tsconfig.build.json
      - ./nest-cli.json:/app/nest-cli.json

  # ─── Postgres local (opcional) ──────────────────────────────────────────
  # Útil si quieres iterar schema sin tocar Supabase.
  # Descomenta este bloque y apunta SUPABASE_URL a este contenedor.
  #
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: arshop-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: arshop
  #     POSTGRES_PASSWORD: arshop
  #     POSTGRES_DB: arshop
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #     - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  #     - ../db/functions.sql:/docker-entrypoint-initdb.d/02-functions.sql:ro
  #     - ../db/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro

volumes:
  redis-data:
  # postgres-data:
